[project]
name = "quokka-sharp-root"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "quokka-sharp",
]

[project.optional-dependencies]
synthesis = [
    "qiskit>=2.5.2",
]

[tool.uv.sources]
quokka-sharp = { path = "quokka_sharp", editable = true }

[tool.ruff.format]
exclude = [
  "*.md",
  "quokka_sharp/quokka_sharp/encoding/comput2cnf.py",
  "quokka_sharp/quokka_sharp/encoding/pauli2cnf.py",
]

[tool.pyright]
extraPaths = ["quokka_sharp"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]
