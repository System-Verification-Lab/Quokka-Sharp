name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked --extra synthesis

      - name: Install synthesis build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make gfortran libblas-dev liblapack-dev

      - name: Install synthesis build dependencies (macOS ARM)
        if: runner.os == 'macOS'
        run: |
          brew install gcc openblas

      - uses: dtolnay/rust-toolchain@stable

      - name: Install all solvers
        run: ./scripts/setup-solvers.sh

      - name: Install synthesis engines
        run: bash scripts/setup-synthesis-engines.sh

      - name: Run tests
        run: |
          export PATH="$PWD/.solvers/bin:$PATH"
          uv run --no-sync pytest tests/ benchmarks/synthesis/test_run.py
